events {
    worker_connections 1024;
}

# ============================================================
# STREAM: TCP Tunnel per il Database (porta 5432)
# ============================================================
# Il modulo stream di NGINX permette di fare proxy di traffico
# TCP generico (non HTTP). Qui esponiamo la porta 5432 verso
# l'host e la inoltriamo al container db nella rete Docker.
#
# Questo permette a strumenti come DBeaver, TablePlus, psql di
# connettersi al database passando attraverso il Gateway, senza
# esporre direttamente la porta 5432 del container db.
# ============================================================
stream {
    server {
        listen 5432;
        proxy_pass db:5432;
        proxy_timeout 600s;
        proxy_connect_timeout 5s;
    }
}

# ============================================================
# HTTP: Configurazioni esistenti (frontend + API)
# ============================================================
http {
    include /etc/nginx/conf.d/*.conf;
}
