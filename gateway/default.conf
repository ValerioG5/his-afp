# ============================================================
# BLUE/GREEN DEPLOYMENT - GATEWAY CONFIGURAZIONE
# ============================================================
# Per switchare il traffico API da BLUE a GREEN (o viceversa):
#   1. Modificare la direttiva upstream qui sotto
#   2. Ricaricare NGINX: docker exec sio-gateway nginx -s reload
#
# upstream backend-api {
#     server sio-backend-blue:3000;   # ← BLUE attivo
#     # server sio-backend-green:3000;  # ← GREEN pronto
# }

upstream backend-api {
    server sio-backend-blue:3000;   # Attivo: BLUE
    # server sio-backend-green:3000;
}

# ============================================================
# AMBIENTE PROD
# ============================================================
server{
    listen 80;
    server_name localhost;
    location / {
        proxy_pass http://fe-prod:80;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend-api;
    }
}

# ============================================================
# AMBIENTE TEST
# ============================================================
server{
    listen 8080;
    location / {
        proxy_pass http://fe-test:80;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend-api;
    }
}

# ============================================================
# AMBIENTE SVI
# ============================================================
server{
    listen 8999;
    location / {
        proxy_pass http://fe-sio:80;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend-api;
    }
}
